<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ye-Zhu TaxFree</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #5b8bb5;
            --accent-color: #f28b82;
            --bg-color: #fdf6f2;
            --card-bg: #ffffff;
            --text-main: #4a4a4a;
            --text-muted: #8a8a8a;
            --success-color: #5fbf9f;
            --macaron-pink: #ffd1dc;
            --macaron-blue: #c7e2ff;
            --macaron-yellow: #fff0b8;
            --macaron-mint: #c8f0e4;
            --macaron-lavender: #e5d4ff;
            --macaron-peach: #ffdbc9;
            --border-soft: #f0e0da;
        }

        body {
            font-family: 'Segoe UI', 'Quicksand', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .calculator-card {
            background-color: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 16px 36px rgba(240, 180, 170, 0.18);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            border-top: 8px solid var(--macaron-blue);
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #c7e2ff 0%, #e5d4ff 100%);
            color: #3a4a5a;
            padding: 22px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #2e3e4e;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 11px;
            opacity: 0.85;
            color: #4e5e6e;
        }

        .content {
            padding: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 12px;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid var(--border-soft);
            border-radius: 18px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.2s;
            color: var(--primary-color);
            background-color: #fffbf9;
        }

        .input-wrapper input:focus {
            border-color: var(--macaron-blue);
            box-shadow: 0 0 0 4px rgba(199, 226, 255, 0.5);
        }

        .input-wrapper .prefix {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .rate-wrapper {
            display: flex;
            align-items: center;
            background-color: #fffbf9;
            border-radius: 18px;
            border: 2px solid var(--border-soft);
            transition: border-color 0.3s, box-shadow 0.2s;
        }

        .rate-wrapper:focus-within {
            border-color: var(--macaron-blue);
            box-shadow: 0 0 0 4px rgba(199, 226, 255, 0.5);
        }

        .rate-prefix {
            padding: 12px 15px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            border-right: 1px solid var(--border-soft);
            white-space: nowrap;
        }

        .rate-wrapper input {
            flex: 1;
            padding: 12px 15px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            background: transparent;
            box-sizing: border-box;
            outline: none;
            color: var(--primary-color);
        }

        .quick-amounts {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .quick-amounts button {
            flex: 1;
            padding: 8px 0;
            border: 1.5px solid var(--border-soft);
            background: #fffbf9;
            border-radius: 14px;
            cursor: pointer;
            font-size: 10px;
            color: var(--text-main);
            transition: all 0.2s;
            font-weight: 500;
        }

        .quick-amounts button:hover {
            background: var(--macaron-pink);
            color: #5a3a3a;
            border-color: var(--macaron-pink);
        }

        .capture-wrapper {
            margin-top: 24px;
            background-color: #ffffff;
        }

        .result-box {
            background-color: #ffffff;
            border-radius: 22px;
            padding: 0;
            border: 2px solid var(--macaron-pink);
            transition: all 0.3s ease;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(255, 180, 170, 0.20);
        }

        .result-box.active {
            background-color: #ffffff;
            border-color: var(--macaron-pink);
        }

        .result-box.error {
            background-color: #fff8f5;
            border-color: var(--macaron-pink);
        }

        /* 結果框內文字：全部減小5px */
        .result-header-title {
            background: linear-gradient(110deg, #ffd1dc 0%, #fff0b8 100%);
            color: #5a3a3a;
            font-size: 13px; /* 18-5 */
            font-weight: 800;
            text-align: center;
            padding: 20px 20px 15px 20px;
            margin: 0;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--macaron-pink);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            padding: 10px 16px;
            background: linear-gradient(90deg, #c8f0e4 0%, #c7e2ff 100%);
            border-bottom: 2px solid var(--macaron-pink);
            font-size: 8px; /* 13-5 */
            color: #3a4a4a;
            text-align: center;
        }

        .meta-info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 80px;
            padding: 4px 0;
            border-right: 1.5px solid rgba(255, 255, 255, 0.7);
        }

        .meta-info-item:last-child {
            border-right: none;
        }

        .meta-info-item .label {
            font-weight: 600;
            color: #4a5a5a;
            font-size: 7px; /* 12-5 */
            margin-bottom: 4px;
        }

        .meta-info-item .value {
            font-weight: 800;
            color: #3a5a7a;
            font-size: 11px; /* 16-5 */
            line-height: 1.2;
        }

        .result-content-padding {
            padding: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #fffbf9 100%);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 40px;
        }

        .result-title {
            font-size: 7px; /* 12-5 */
            font-weight: 700;
            color: #5a4a4a;
            margin-bottom: 4px;
        }

        .result-formula-left {
            font-size: 4px; /* 9-5，注意可能过小 */
            color: #a89890;
            line-height: 1.4;
            background: transparent;
            padding: 0;
            margin: 0;
            display: block;
            text-align: left;
            word-break: break-word;
        }

        .result-value-col {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            max-width: 65%;
        }

        .result-cny {
            font-size: 15px; /* 20-5 */
            font-weight: 800;
            color: #4a7aa8;
            line-height: 1.2;
        }

        .result-krw {
            font-size: 5px; /* 10-5，注意可能过小 */
            color: var(--text-muted);
            margin-top: 2px;
        }

        .result-item.highlight {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2.5px dashed #c8f0e4;
        }

        .result-item.highlight .result-title {
            font-size: 7px; /* 12-5 */
            color: #2e8b6a;
            font-weight: 800;
        }

        .result-item.highlight .result-cny {
            font-size: 17px; /* 22-5 */
            color: #2e8b6a;
        }

        .result-item.highlight .result-formula-left {
            color: #4aa88a;
        }

        .error-text {
            color: var(--accent-color);
            font-size: 8px; /* 13-5 */
            font-weight: 600;
            text-align: center;
            padding: 20px 0;
            display: none;
        }

        .export-btn-wrapper {
            margin-top: 20px;
            text-align: center;
        }

        .export-btn {
            background: linear-gradient(135deg, #c7e2ff, #e5d4ff);
            color: #3a3a5a;
            border: none;
            border-radius: 20px;
            padding: 15px 30px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 16px rgba(180, 190, 240, 0.35);
            letter-spacing: 0.5px;
        }

        .export-btn:hover {
            background: linear-gradient(135deg, #b7d2ff, #d5c4ff);
            box-shadow: 0 8px 20px rgba(160, 170, 230, 0.45);
        }

        .export-btn:active {
            transform: scale(0.98);
        }
        
        .export-btn:disabled {
            background: #e8e0e8;
            color: #a0a0a0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-box.error .result-header-title {
            background: linear-gradient(110deg, #ffd1dc 0%, #ffb8c8 100%);
        }
        .result-box.error .meta-info {
            background: linear-gradient(90deg, #c8f0e4 0%, #c7e2ff 100%);
        }

        .calculator-card::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 18px;
            width: 10px;
            height: 10px;
            background: var(--macaron-yellow);
            border-radius: 50%;
            opacity: 0.9;
        }

        .calculator-card::after {
            content: '';
            position: absolute;
            top: 14px;
            right: 18px;
            width: 10px;
            height: 10px;
            background: var(--macaron-peach);
            border-radius: 50%;
            opacity: 0.9;
        }

        /* 图片预览区域 */
        .image-preview-area {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #fff7f5;
            border-radius: 20px;
            padding: 12px;
            border: 1px dashed var(--macaron-blue);
            transition: opacity 0.3s;
        }

        .image-preview-area img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 6px 14px rgba(180, 190, 240, 0.3);
            border: 2px solid white;
        }

        .image-preview-area .preview-label {
            font-size: 10px;
            color: #8a7a7a;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <h1>NICE TAX FREE</h1>
        <p>退税 & 到手价计算器</p>
    </div>
    
    <div class="content">
        <div class="input-group">
            <label for="rateInput">当前汇率（采自Wise）</label>
            <div class="rate-wrapper">
                <div class="rate-prefix">1 CNY =</div>
                <input type="number" id="rateInput" step="0.01" placeholder="206.5" oninput="calculate()">
            </div>
        </div>

        <div class="input-group">
            <label for="amountInput">请输入购买金额</label>
            <div class="input-wrapper">
                <span class="prefix">₩</span>
                <input type="number" id="amountInput" placeholder="0" min="0" oninput="calculate()">
            </div>
        </div>
		
		<div class="quick-amounts">
            <button onclick="setAmount(50000)">₩50,000</button>
            <button onclick="setAmount(100000)">₩100,000</button>
            <button onclick="setAmount(500000)">₩500,000</button>
            <button onclick="setAmount(1000000)">₩1,000,000</button>
        </div>
		<br>

        <div class="input-group">
            <label for="discountInput">请输入折扣 (填写百分比，如 10 代表 9 折)</label>
            <div class="input-wrapper">
                <input type="number" id="discountInput" placeholder="0" min="0" max="100" oninput="calculate()" style="padding-left: 15px; padding-right: 40px;">
                <span class="prefix" style="left: auto; right: 15px;">%</span>
            </div>
        </div>

        <div id="captureArea" class="capture-wrapper">
            <div class="result-box" id="resultBox">
                <h2 class="result-header-title">野猪购物返点</h2>

                <div class="meta-info" id="metaInfo">
                    <div class="meta-info-item">
                        <span class="label">百货店标价</span>
                        <span class="value" id="metaOriginal">₩ 0</span>
                    </div>
                    <div class="meta-info-item">
                        <span class="label">券+返点</span>
                        <span class="value" id="metaDiscount">0%</span>
                    </div>
                    <div class="meta-info-item">
                        <span class="label">汇率</span>
                        <span class="value" id="metaRate">206.50</span>
                    </div>
                </div>
                
                <div class="result-content-padding">
                    <div id="errorMsg" class="error-text">单笔购买原价需满 30,000 韩元才可退税</div>
                    
                    <div id="resultsContent">
                        <div class="result-item">
                            <div class="result-label-col">
                                <span class="result-title">折后商品价格</span>
                                <span class="result-formula-left" id="finalPriceFormula"></span>
                            </div>
                            <div class="result-value-col">
                                <span class="result-cny" id="finalPriceCny">¥ 0.00</span>
                                <span class="result-krw" id="finalPriceKrw">₩ 0</span>
                            </div>
                        </div>

                        <div class="result-item">
                            <div class="result-label-col">
                                <span class="result-title">预计退税额</span>
                                <span class="result-formula-left" id="refundFormula"></span>
                            </div>
                            <div class="result-value-col">
                                <span class="result-cny" id="refundCny">¥ 0.00</span>
                                <span class="result-krw" id="refundKrw">₩ 0</span>
                            </div>
                        </div>

                        <div class="result-item highlight">
                            <div class="result-label-col">
                                <span class="result-title">最终实际到手价</span>
                                <span class="result-formula-left" id="actualPriceFormula"></span>
                            </div>
                            <div class="result-value-col">
                                <span class="result-cny" id="actualPriceCny">¥ 0.00</span>
                                <span class="result-krw" id="actualPriceKrw">₩ 0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="export-btn-wrapper">
            <button class="export-btn" id="exportBtn" onclick="exportImage()">
                一键出图
            </button>
        </div>

        <!-- 图片预览区域 -->
        <div class="image-preview-area" id="imagePreviewArea" style="display: none;">
            <span class="preview-label">📸 预览</span>
            <img id="previewImage" src="" alt="退税计算结果图">
        </div>
    </div>
</div>

    const defaultDiscount = 12.5;

    ];

    const formatKRW = (num) => Math.round(num).toLocaleString('en-US');
    const formatCNY = (num) => Number(num.toFixed(2)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function setAmount(value) {
        amountInputEl.value = value;
        calculate();
    }

    function updateMetaInfo(originalAmount, discountPercent, rate) {
        if (isNaN(originalAmount) || originalAmount <= 0) {
            metaOriginal.textContent = '₩ 0';
        } else {
            metaOriginal.textContent = `₩ ${formatKRW(originalAmount)}`;
        }
        if (isNaN(discountPercent) || discountPercent < 0) {
            metaDiscount.textContent = '0%';
        } else {
            const validDiscount = Math.min(100, Math.max(0, discountPercent));
            metaDiscount.textContent = `${validDiscount}%`;
        }
        if (isNaN(rate) || rate <= 0) {
            metaRate.textContent = defaultRate.toFixed(2);
        } else {
            metaRate.textContent = rate.toFixed(2);
        }
    }

    function calculate() {
        const originalAmount = parseFloat(amountInputEl.value);
        const discountPercent = parseFloat(discountInputEl.value) || 0;
        let rate = parseFloat(rateInputEl.value);
        if (isNaN(rate) || rate <= 0) rate = defaultRate;

        updateMetaInfo(originalAmount, discountPercent, rate);

        resultBox.className = 'result-box';
        resultsContent.style.display = 'block';
        errorMsg.style.display = 'none';

        // 清空预览（因为结果变化）
        if (imagePreviewArea.style.display !== 'none') {
            imagePreviewArea.style.display = 'none';
            previewImage.src = '';
        }

        if (isNaN(originalAmount) || originalAmount <= 0) {
            finalPriceCny.textContent = "¥ 0.00";
            finalPriceKrw.textContent = "₩ 0";
            finalPriceFormula.textContent = "";
            
            refundCny.textContent = "¥ 0.00";
            refundKrw.textContent = "₩ 0";
            refundFormula.textContent = "";

            actualPriceCny.textContent = "¥ 0.00";
            actualPriceKrw.textContent = "₩ 0";
            actualPriceFormula.textContent = "";
            return;
        }

        const validDiscount = Math.max(0, Math.min(100, discountPercent));
        const discountMultiplier = 1 - (validDiscount / 100);
        const finalPrice = originalAmount * discountMultiplier;
        
        finalPriceCny.textContent = `¥ ${formatCNY(finalPrice / rate)}`;
        finalPriceKrw.textContent = `₩ ${formatKRW(finalPrice)}`;
        finalPriceFormula.textContent = `原价 ₩${formatKRW(originalAmount)} × (1 - ${validDiscount}%)`;

        let refund = 0;
        if (originalAmount < 30000) {
            resultBox.classList.add('error');
            resultsContent.style.display = 'none';
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = `购买原价 ₩${formatKRW(originalAmount)} 未满 30,000 韩元，无法退税。`;
            return;
        }

        resultBox.classList.add('active');

        let refundFormulaText = "";
        if (originalAmount >= 6000000) {
            refund = Math.floor(originalAmount * 0.0818);
            refundFormulaText = `原价 ≥ 600万，退税 = 原价 × 0.0818`;
        } else {
            for (let bracket of taxBrackets) {
                if (originalAmount >= bracket.min && originalAmount <= bracket.max) {
                    refund = bracket.refund;
                    break;
                }
            }
            refundFormulaText = `按原价落在的阶梯区间，固定退税`;
        }

        refundCny.textContent = `¥ ${formatCNY(refund / rate)}`;
        refundKrw.textContent = `₩ ${formatKRW(refund)}`;
        refundFormula.textContent = refundFormulaText;

        const actualPrice = finalPrice - refund;

        actualPriceCny.textContent = `¥ ${formatCNY(actualPrice / rate)}`;
        actualPriceKrw.textContent = `₩ ${formatKRW(actualPrice)}`;
        actualPriceFormula.textContent = `折后价 − 退税 = 实际到手价`;
    }

    function exportImage() {
        const btn = document.getElementById('exportBtn');
        const captureArea = document.getElementById('captureArea');
        
        const originalAmount = parseFloat(amountInputEl.value);
        if (isNaN(originalAmount) || originalAmount <= 0) {
            alert("请先输入购买金额！");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = "正在生成图片...";

        html2canvas(captureArea, {
            backgroundColor: "#ffffff",
            scale: 2,
            useCORS: true,
            borderRadius: 22
        }).then(canvas => {
            btn.disabled = false;
            btn.innerHTML = "一键出图";

            const imgData = canvas.toDataURL('image/png');
            
            // 显示预览区域（不再自动下载）
            previewImage.src = imgData;
            imagePreviewArea.style.display = 'flex';

        }).catch(err => {
            console.error("生成图片失败:", err);
            alert("生成图片失败，请检查网络后重试。");
            btn.disabled = false;
            btn.innerHTML = "一键出图";
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        calculate();
        imagePreviewArea.style.display = 'none';
    });
</script>

</body>
</html>
