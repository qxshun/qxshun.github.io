<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单的HTML页面</title>
    <!-- 内嵌样式使页面更美观，同时保持简单 -->
    <style>
        /* 全局重置和基础风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f5f7fa 0%, #e9edf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            line-height: 1.5;
        }

        /* 卡片式容器 — 清晰且现代 */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            max-width: 600px;
            width: 100%;
            padding: 2.5rem 2rem;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.2), 
                        0 5px 12px -4px rgba(0, 0, 0, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease;
            text-align: center;
        }

        .card:hover {
            transform: scale(1.01);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e2b3c;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        h1 span {
            background: #2d6ae0;
            color: white;
            font-size: 1.4rem;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
        }

        .subtitle {
            color: #4a5b6e;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 1.2rem;
        }

        /* 问候语区域 — 动态显示 */
        .greeting-box {
            background: #f0f4fe;
            border-radius: 1.2rem;
            padding: 1.2rem 1.5rem;
            margin: 1.8rem 0 1.8rem;
            border-left: 6px solid #2d6ae0;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.02);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .greeting-box .emoji {
            font-size: 2rem;
            line-height: 1;
        }

        .greeting-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0b1e32;
            word-break: break-word;
        }

        .greeting-text small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #3f5a7a;
            display: block;
            margin-top: 0.2rem;
        }

        /* 按钮设计 */
        .btn {
            background: #2d6ae0;
            color: white;
            border: none;
            padding: 0.9rem 2.2rem;
            font-size: 1.2rem;
            font-weight: 500;
            border-radius: 60px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 12px 18px -8px rgba(45, 106, 224, 0.4), 0 4px 8px -2px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 0.3px;
            margin-bottom: 1.2rem;
        }

        .btn:hover {
            background: #1f54c0;
            box-shadow: 0 16px 22px -8px rgba(45, 106, 224, 0.5), 0 6px 12px -4px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 6px 10px -6px rgba(45, 106, 224, 0.6);
        }

        .btn i {
            font-style: normal;
            font-size: 1.3rem;
        }

        /* 页脚和微小细节 */
        footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #6c7e94;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        footer .dot {
            width: 5px;
            height: 5px;
            background: #9aaec5;
            border-radius: 50%;
        }

        /* 时间/日期小标签 */
        .time-badge {
            background: #e6ecf5;
            color: #1d3b5c;
            padding: 0.35rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-block;
            margin-top: 0.5rem;
            border: 1px solid #cddae9;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 主标题 -->
        <h1>
            🧩 简单页面
            <span>HTML</span>
        </h1>
        <p class="subtitle">一个清爽、现代且可交互的示例</p>

        <!-- 动态问候语显示区 -->
        <div class="greeting-box">
            <div class="emoji" id="greetingEmoji">👋</div>
            <div class="greeting-text" id="greetingMessage">
                你好，欢迎！
                <small>点击下方按钮更新问候语</small>
            </div>
        </div>

        <!-- 按钮：触发问候语变更 -->
        <button class="btn" id="actionButton">
            <i>✨</i> 改变问候语
        </button>

        <!-- 小细节：显示当前时间或者点击次数（增加趣味） -->
        <div class="time-badge" id="infoBadge">
            ⏱️ 点击按钮试试
        </div>

        <footer>
            <span>简单 HTML</span>
            <span class="dot"></span>
            <span>CSS + JS</span>
        </footer>
    </div>

    <!-- 内嵌脚本，实现交互逻辑 -->
    <script>
        (function() {
            // 获取需要操作的DOM元素
            const greetingMsgElement = document.getElementById('greetingMessage');
            const emojiElement = document.getElementById('greetingEmoji');
            const actionButton = document.getElementById('actionButton');
            const infoBadge = document.getElementById('infoBadge');

            // 预定义的问候语库：数组每个元素包含 [消息内容, 表情, 附加小字]
            const greetings = [
                { text: '你好，欢迎！', emoji: '👋', detail: '点击下方按钮更新问候语' },
                { text: '今天过得怎么样？', emoji: '🌞', detail: '阳光总在风雨后' },
                { text: '保持热爱，奔赴山海', emoji: '🏔️', detail: '每一步都算数' },
                { text: '代码写完了吗？', emoji: '💻', detail: '休息一下，喝杯咖啡吧' },
                { text: 'Hello, World!', emoji: '🌍', detail: '编程从问候开始' },
                { text: '你超棒的！', emoji: '🌟', detail: '相信自己，继续前进' },
                { text: '每一个不曾起舞的日子', emoji: '💃', detail: '都是对生命的辜负' },
                { text: '笑一笑，没什么大不了', emoji: '😄', detail: '保持好心情' },
                { text: '简单就是美', emoji: '🍃', detail: 'Less is more' }
            ];

            // 记录当前显示的问候语索引 (初始显示第一个，索引0)
            let currentIndex = 0;

            // 更新问候语函数 — 从数组中选取下一个问候语
            function updateGreeting() {
                // 循环索引：每次递增，如果超出则回到0
                currentIndex = (currentIndex + 1) % greetings.length;
                const greeting = greetings[currentIndex];

                // 更新DOM内容
                // 注意：greetingMsgElement 内部包含一个 <small> 标签，我们需要重新构建
                greetingMsgElement.innerHTML = `
                    ${greeting.text}
                    <small>${greeting.detail}</small>
                `;
                // 更新表情
                emojiElement.textContent = greeting.emoji;

                // 同时更新底部小徽章，显示点击次数或当前索引（增加趣味）
                const clickCount = currentIndex + 1;  // 显示已切换次数（从1开始）
                infoBadge.textContent = `✨ 已切换 ${clickCount} 次 | 今天也要开心`;
            }

            // 首次加载：从第一个问候语开始 (索引0)，但我们希望显示第一条并设置点击次数为0
            // 但为了美观，设置初始徽章内容，而不是从点击开始算
            function setInitialGreeting() {
                const first = greetings[0];
                greetingMsgElement.innerHTML = `
                    ${first.text}
                    <small>${first.detail}</small>
                `;
                emojiElement.textContent = first.emoji;
                infoBadge.textContent = '⏱️ 点击按钮试试';
                currentIndex = 0;  // 当前显示的是第0个
            }

            // 绑定按钮点击事件
            actionButton.addEventListener('click', updateGreeting);

            // 额外：鼠标悬停按钮时的小提示（可选，通过title属性）
            actionButton.title = '点击切换不同问候语';

            // 页面加载完成后设置初始状态（但其实立即执行也可以，确保正确显示）
            setInitialGreeting();

            // 可选：在页面加载时显示一次可爱的小动画？不需要太复杂，保持简单。
            // 但是我们可以让徽章显示当前时间？为了简洁，保留点击更新方式。
            // 另外，点击时也可以加个小效果: 按钮短暂禁用？不需要，保持轻量。
        })();
    </script>
    <!-- 说明：所有样式与脚本均内嵌，完全自包含。这是一个简单、干净、可交互的HTML页面。 -->
</body>
</html>
