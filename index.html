<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Nice Tax-Free</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Quicksand', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;        /* 完全无背景 */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px 12px 30px;
            margin: 0;
        }

        /* 移除大圆框卡片，直接使用流式布局 */
        .calculator-card {
            background: transparent;        /* 透明，去除白色卡片背景 */
            box-shadow: none;               /* 去除阴影 */
            border-radius: 0;               /* 去除圆角 */
            width: 100%;
            max-width: 420px;
            overflow: visible;
            border: none;
            position: relative;
        }

        /* 头部 – 添加渐变背景 */
        .header {
            background: linear-gradient(110deg, #dbeeff 0%, #e6dfff 100%);
            border-radius: 24px;
            padding: 20px 16px 18px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 14px rgba(200, 210, 255, 0.2);
            margin-bottom: 24px; /* 增加与下方内容的间距 */
        }

        /* 左右两侧的装饰圆点 */
        .header::before,
        .header::after {
            content: '';
            position: absolute;
            top: 18px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .header::before {
            left: 18px;
            background-color: #fff7bb;
        }

        .header::after {
            right: 18px;
            background-color: #ffe5cf;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #1e2e3e;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.8;
            color: #3a4a5a;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 内容区域 – 无背景块，直接展示输入 */
        .content {
            padding: 0;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #3a4a5a;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 42px;
            font-size: 16px;
            font-weight: 600;
            border: 1.8px solid #ede3dd;
            border-radius: 20px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.15s;
            color: #2d4a6a;
            background: #fefcfb;
            letter-spacing: 0.3px;
        }

        .input-wrapper input:focus {
            border-color: #b8d0e8;
            box-shadow: 0 0 0 4px rgba(199, 226, 255, 0.4);
            background: #ffffff;
        }

        .input-wrapper .prefix {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            font-weight: 600;
            color: #8f9eb0;
        }

        .rate-wrapper {
            display: flex;
            align-items: center;
            background: #fefcfb;
            border-radius: 20px;
            border: 1.8px solid #ede3dd;
            transition: all 0.15s;
        }

        .rate-wrapper:focus-within {
            border-color: #b8d0e8;
            box-shadow: 0 0 0 4px rgba(199, 226, 255, 0.4);
            background: #ffffff;
        }

        .rate-prefix {
            padding: 12px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #3a4a5a;
            border-right: 1px solid #ede3dd;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .rate-wrapper input {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            background: transparent;
            outline: none;
            color: #2d4a6a;
        }

        .quick-amounts {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        .quick-amounts button {
            flex: 1;
            padding: 10px 0;
            border: 1.5px solid #ede3dd;
            background: #fefcfb;
            border-radius: 18px;
            cursor: pointer;
            font-size: 11px;
            color: #3a4a5a;
            transition: all 0.15s;
            font-weight: 600;
            letter-spacing: 0.2px;
            -webkit-tap-highlight-color: transparent;
        }

        .quick-amounts button:hover,
        .quick-amounts button:active {
            background: #ffe6e6;
            color: #7a4a4a;
            border-color: #ffc8c8;
        }

        /* 结果区域 – 保留内部卡片样式，但外容器无背景无框 */
        .capture-wrapper {
            margin-top: 28px;
            background: transparent;
        }

        .result-box {
            background-color: #ffffff;
            border-radius: 28px;
            padding: 0;
            border: 2px solid #ffe2e2;
            transition: all 0.15s;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(255, 200, 190, 0.12);
        }

        .result-box.active {
            border-color: #ffd1dc;
        }

        .result-box.error {
            border-color: #ffd1dc;
            background: #fffcfb;
        }

        .result-header-title {
            background: linear-gradient(110deg, #ffd1dc 0%, #fff0b8 100%);
            color: #5a3a3a;
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            padding: 18px 12px 4px;
            margin: 0;
            letter-spacing: 1.5px;
            border-bottom: 1.5px solid #ffe2e2;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7);
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            padding: 10px 8px;
            background: linear-gradient(90deg, #e2f2ec 0%, #dae8ff 100%);
            border-bottom: 1.5px solid #ffe2e2;
            font-size: 15px;
            color: #2e4a4a;
            text-align: center;
        }

		.meta-info-item {
			display: flex;
			flex-direction: column;
			align-items: center;
			min-width: 0;
			padding: 4px 0;
			border-right: 1px solid rgba(255, 255, 255, 0.8);
		}

		.meta-info-item:nth-child(1) {
			flex: 0 0 34%;
		}

		.meta-info-item:nth-child(2) {
			flex: 0 0 33%;
		}

		.meta-info-item:nth-child(3) {
			flex: 1;
		}

        .meta-info-item:last-child {
            border-right: none;
        }

        .meta-info-item .label {
            font-weight: 600;
            color: #3e5a5a;
            font-size: 12px;
            margin-bottom: 4px;
            letter-spacing: 0.2px;
        }

        .meta-info-item .value {
            font-weight: 800;
            color: #1e3e5e;
            font-size: 15px;
            line-height: 1.2;
            word-break: break-word;
        }

        .result-content-padding {
            padding: 20px 18px 18px;
            background: #ffffff;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 40px;
            padding-right: 6px;
        }

        .result-title {
            font-size: 14px;
            font-weight: 700;
            color: #4a3a3a;
            margin-bottom: 3px;
            letter-spacing: 0.2px;
        }

        .result-formula-left {
            font-size: 10px;
            color: #b0a09a;
            line-height: 1.4;
            word-break: break-word;
            text-align: left;
        }

        .result-value-col {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            max-width: 60%;
            flex-shrink: 0;
        }

        .result-cny {
            font-size: 16px;
            font-weight: 800;
            color: #2e6a9e;
            line-height: 1.2;
            letter-spacing: 0.2px;
        }

        .result-krw {
            font-size: 10px;
            color: #9a9a9a;
            margin-top: 2px;
            font-weight: 500;
        }

        .result-item.highlight {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px dashed #c8e8dc;
        }

        .result-item.highlight .result-title {
            font-size: 15px;
            color: #2e8b6a;
            font-weight: 800;
            letter-spacing: 0.1px;
        }

        .result-item.highlight .result-cny {
            font-size: 16px;
            color: #2e8b6a;
            font-weight: 800;
        }

        .result-item.highlight .result-formula-left {
            color: #3ea88a;
            font-size: 10px;
        }

        .error-text {
            color: #e06b6b;
            font-size: 9px;
            font-weight: 600;
            text-align: center;
            padding: 12px 0 6px;
            display: none;
            letter-spacing: 0.2px;
            background: #fff6f5;
            border-radius: 14px;
            margin: 6px 0;
        }

        .export-btn-wrapper {
            margin-top: 22px;
            text-align: center;
        }

        .export-btn {
            background: linear-gradient(135deg, #d4e6ff, #efe2ff);
            color: #1e2e4e;
            border: none;
            border-radius: 28px;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 16px rgba(180, 190, 240, 0.25);
            letter-spacing: 0.8px;
            -webkit-tap-highlight-color: transparent;
        }

        .export-btn:hover,
        .export-btn:active {
            background: linear-gradient(135deg, #bdd6ff, #e0cfff);
            box-shadow: 0 8px 20px rgba(160, 170, 230, 0.35);
            transform: scale(0.99);
        }

        .export-btn:disabled {
            background: #eee6ee;
            color: #a0a0a0;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .image-preview-area {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #fef9f8;
            border-radius: 24px;
            padding: 14px 12px;
            border: 1px dashed #c7e2ff;
            transition: opacity 0.2s;
        }

        .image-preview-area img {
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(160, 180, 220, 0.2);
            border: 2px solid white;
        }

        .image-preview-area .preview-label {
            font-size: 10px;
            color: #7a8a9a;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        @media (max-width: 360px) {
            .header h1 {
                font-size: 22px;
            }
            .result-cny {
                font-size: 14px;
            }
            .result-item.highlight .result-cny {
                font-size: 16px;
            }
            .quick-amounts button {
                font-size: 9px;
                padding: 8px 0;
            }
            .meta-info-item .value {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<!-- 移除了 .calculator-card 的圆框样式，但保留结构 -->
<div class="calculator-card">
    <div class="header">
        <h1>NICE TAX FREE</h1>
        <p>退税 & 到手价计算器</p>
    </div>
    
    <div class="content">
        <!-- 汇率 -->
        <div class="input-group">
            <label for="rateInput">当前汇率</label>
            <div class="rate-wrapper">
                <div class="rate-prefix">1 CNY =</div>
                <input type="number" id="rateInput" step="0.01" placeholder="206.5" oninput="calculate()">
            </div>
        </div>

        <!-- 购买金额 -->
        <div class="input-group">
            <label for="amountInput">请输入购买金额</label>
            <div class="input-wrapper">
                <span class="prefix">₩</span>
                <input type="number" id="amountInput" placeholder="0" min="0" oninput="calculate()">
            </div>
        </div>
		
        <!-- 快捷金额 
		<div class="quick-amounts">
            <button onclick="setAmount(1000000)">₩1,000,000</button>
            <button onclick="setAmount(5000000)">₩5,000,000</button>
            <button onclick="setAmount(10000000)">₩10,000,000</button>
            <button onclick="setAmount(50000000)">₩50,000,000</button>
        </div>
		-->
		<br>

        <!-- 折扣 -->
        <div class="input-group">
            <label for="discountInput">折扣百分比 (如 10 代表 9 折)</label>
            <div class="input-wrapper">
                <input type="number" id="discountInput" placeholder="0" min="0" max="100" oninput="calculate()" style="padding-left: 16px; padding-right: 42px;">
                <span class="prefix" style="left: auto; right: 16px;">%</span>
            </div>
        </div>

        <!-- 截图区域 -->
        <div id="captureArea" class="capture-wrapper">
            <div class="result-box" id="resultBox">
                <h2 class="result-header-title">野猪购物返点</h2>

                <div class="meta-info" id="metaInfo">
                    <div class="meta-info-item">
                        <span class="label">百货店标价</span>
                        <span class="value" id="metaOriginal">₩ 0</span>
                    </div>
                    <div class="meta-info-item">
                        <span class="label">券+返点</span>
                        <span class="value" id="metaDiscount">0%</span>
                    </div>
                    <div class="meta-info-item">
                        <span class="label">汇率</span>
                        <span class="value" id="metaRate">206.50</span>
                    </div>
                </div>
                
                <div class="result-content-padding">
                    <div id="errorMsg" class="error-text">单笔购买原价需满 30,000 韩元才可退税</div>
                    
                    <div id="resultsContent">
                        <div class="result-item">
                            <div class="result-label-col">
                                <span class="result-title">折后商品价格</span>
                                <span class="result-formula-left" id="finalPriceFormula"></span>
                            </div>
                            <div class="result-value-col">
                                <span class="result-cny" id="finalPriceCny">¥ 0.00</span>
                                <span class="result-krw" id="finalPriceKrw">₩ 0</span>
                            </div>
                        </div>

                        <div class="result-item">
                            <div class="result-label-col">
                                <span class="result-title">预计退税额</span>
                                <span class="result-formula-left" id="refundFormula"></span>
                            </div>
                            <div class="result-value-col">
                                <span class="result-cny" id="refundCny">¥ 0.00</span>
                                <span class="result-krw" id="refundKrw">₩ 0</span>
                            </div>
                        </div>

                        <div class="result-item highlight">
                            <div class="result-label-col">
                                <span class="result-title">最终实际到手价</span>
                                <span class="result-formula-left" id="actualPriceFormula"></span>
                            </div>
                            <div class="result-value-col">
                                <span class="result-cny" id="actualPriceCny">¥ 0.00</span>
                                <span class="result-krw" id="actualPriceKrw">₩ 0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 一键出图 -->
        <div class="export-btn-wrapper">
            <button class="export-btn" id="exportBtn" onclick="exportImage()">
                一键出图
            </button>
        </div>

        <!-- 预览图 -->
        <div class="image-preview-area" id="imagePreviewArea" style="display: none;">
            <span class="preview-label">预览 · 长按保存</span>
            <img id="previewImage" src="" alt="退税计算结果图">
        </div>
    </div>
</div>

    ];

    const formatKRW = (num) => Math.round(num).toLocaleString('en-US');
    const formatCNY = (num) => Number(num.toFixed(2)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function setAmount(value) {
        amountInputEl.value = value;
        calculate();
    }

    function updateMetaInfo(originalAmount, discountPercent, rate) {
        if (isNaN(originalAmount) || originalAmount <= 0) {
            metaOriginal.textContent = '₩ 0';
        } else {
            metaOriginal.textContent = `₩ ${formatKRW(originalAmount)}`;
        }
        if (isNaN(discountPercent) || discountPercent < 0) {
            metaDiscount.textContent = '0%';
        } else {
            const validDiscount = Math.min(100, Math.max(0, discountPercent));
            metaDiscount.textContent = `${validDiscount}%`;
        }
        if (isNaN(rate) || rate <= 0) {
            metaRate.textContent = defaultRate.toFixed(2);
        } else {
            metaRate.textContent = rate.toFixed(2);
        }
    }

    function calculate() {
        const originalAmount = parseFloat(amountInputEl.value);
        const discountPercent = parseFloat(discountInputEl.value) || 0;
        let rate = parseFloat(rateInputEl.value);
        if (isNaN(rate) || rate <= 0) rate = defaultRate;

        updateMetaInfo(originalAmount, discountPercent, rate);

        resultBox.className = 'result-box';
        resultsContent.style.display = 'block';
        errorMsg.style.display = 'none';

        if (imagePreviewArea.style.display !== 'none') {
            imagePreviewArea.style.display = 'none';
            previewImage.src = '';
        }

        if (isNaN(originalAmount) || originalAmount <= 0) {
            finalPriceCny.textContent = "¥ 0.00";
            finalPriceKrw.textContent = "₩ 0";
            finalPriceFormula.textContent = "";
            
            refundCny.textContent = "¥ 0.00";
            refundKrw.textContent = "₩ 0";
            refundFormula.textContent = "";

            actualPriceCny.textContent = "¥ 0.00";
            actualPriceKrw.textContent = "₩ 0";
            actualPriceFormula.textContent = "";
            return;
        }

        const validDiscount = Math.max(0, Math.min(100, discountPercent));
        const discountMultiplier = 1 - (validDiscount / 100);
        const finalPrice = originalAmount * discountMultiplier;
        
        finalPriceCny.textContent = `¥ ${formatCNY(finalPrice / rate)}`;
        finalPriceKrw.textContent = `₩ ${formatKRW(finalPrice)}`;
        finalPriceFormula.textContent = `原价 ₩${formatKRW(originalAmount)} × (1 - ${validDiscount}%)`;

        let refund = 0;
        if (originalAmount < 30000) {
            resultBox.classList.add('error');
            resultsContent.style.display = 'none';
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = `购买原价 ₩${formatKRW(originalAmount)} 未满 30,000 韩元，无法退税。`;
            return;
        }

        resultBox.classList.add('active');

        let refundFormulaText = "";
        if (originalAmount >= 6000000) {
            refund = Math.floor(originalAmount * 0.0818);
            refundFormulaText = `原价 ≥ 600万，退税 = 原价 × 0.0818`;
        } else {
            for (let bracket of taxBrackets) {
                if (originalAmount >= bracket.min && originalAmount <= bracket.max) {
                    refund = bracket.refund;
                    break;
                }
            }
            refundFormulaText = `按原价落在的阶梯区间，固定退税`;
        }

        refundCny.textContent = `¥ ${formatCNY(refund / rate)}`;
        refundKrw.textContent = `₩ ${formatKRW(refund)}`;
        refundFormula.textContent = refundFormulaText;

        const actualPrice = finalPrice - refund;

        actualPriceCny.textContent = `¥ ${formatCNY(actualPrice / rate)}`;
        actualPriceKrw.textContent = `₩ ${formatKRW(actualPrice)}`;
        actualPriceFormula.textContent = `折后价 − 退税 = 实际到手价`;
    }

    function exportImage() {
        const btn = document.getElementById('exportBtn');
        const captureArea = document.getElementById('captureArea');
        
        const originalAmount = parseFloat(amountInputEl.value);
        if (isNaN(originalAmount) || originalAmount <= 0) {
            alert("请先输入购买金额！");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = "生成中...";

        html2canvas(captureArea, {
            backgroundColor: "#ffffff",
            scale: 2,
            useCORS: true,
            borderRadius: 28
        }).then(canvas => {
            btn.disabled = false;
            btn.innerHTML = "一键出图";

            const imgData = canvas.toDataURL('image/png');
            
            previewImage.src = imgData;
            imagePreviewArea.style.display = 'flex';

        }).catch(err => {
            console.error("生成图片失败:", err);
            alert("生成图片失败，请检查网络后重试。");
            btn.disabled = false;
            btn.innerHTML = "一键出图";
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        calculate();
        imagePreviewArea.style.display = 'none';
    });
</script>

</body>
</html>
