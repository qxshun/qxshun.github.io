<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>百货店返点计算器</title>
  <style>
    /* ===== 全局重置 & 字体 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      background: #f3f5f8;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #222;
      padding: 12px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 0;
    }

    /* ===== 主标题 ===== */
    h1 {
      text-align: center;
      background: #102a43;
      color: white;
      padding: 16px 10px;
      border-radius: 14px;
      font-size: 22px;
      letter-spacing: 1px;
      margin-bottom: 0;
    }

    /* ===== 卡片 ===== */
    .card {
      background: white;
      margin-top: 14px;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #102a43;
      margin-bottom: 4px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      font-size: 15px;
    }

    input,
    select {
      width: 100%;
      margin-top: 6px;
      padding: 13px 12px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      outline: none;
      transition: border 0.15s;
    }

    input:focus,
    select:focus {
      border-color: #102a43;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #102a43;
      color: white;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: 0.5px;
    }

    button:active {
      opacity: 0.8;
    }

    /* ===== 结果区域 ===== */
    .result pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f8fafc;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.7;
      font-size: 15px;
      margin-top: 6px;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    /* ===== 报价预览卡片 (手机自适应) ===== */
    .quote-card-wrap {
      width: 100%;
      overflow: hidden;
    }

    #quoteCard {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #f8e6df;
      color: #000;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", serif;
      border: 1px solid #ff8f8f;
      overflow: hidden;
      border-radius: 4px;
    }

    .quote-title {
      background: #ff8f8f;
      text-align: center;
      font-size: clamp(24px, 7vw, 30px);
      font-weight: bold;
      line-height: 1.35;
      padding: 4px 0;
      letter-spacing: 2px;
    }

    .quote-table {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }

    .quote-header {
      background: #dfe5ff;
      text-align: center;
      font-size: clamp(21px, 6vw, 28px);
      line-height: 1.4;
      padding: 4px 0;
      font-weight: normal;
    }

    .quote-value {
      background: #f7ddeb;
      text-align: center;
      font-size: clamp(21px, 6vw, 28px);
      line-height: 1.4;
      padding: 4px 0;
    }

    .quote-lines {
      padding: 16px 10px 14px 10px;
      background: #f8e6df;
    }

    .quote-lines div {
      font-size: clamp(17px, 4.6vw, 23px);
      line-height: 1.55;
      white-space: normal;
      word-break: keep-all;
      margin-bottom: 14px;
    }

    .quote-lines div:last-child {
      margin-bottom: 0;
    }

    /* ===== 导出图片专用样式 (固定600px) ===== */
    .export-card {
      width: 600px !important;
      max-width: 600px !important;
      min-width: 600px !important;
      margin: 0 !important;
    }

    .export-card .quote-title {
      font-size: 30px !important;
      line-height: 42px !important;
      padding: 0 !important;
    }

    .export-card .quote-header {
      font-size: 28px !important;
      line-height: 42px !important;
      padding: 0 !important;
    }

    .export-card .quote-value {
      font-size: 28px !important;
      line-height: 42px !important;
      padding: 0 !important;
    }

    .export-card .quote-lines {
      padding: 18px 10px 14px 10px !important;
    }

    .export-card .quote-lines div {
      font-size: 23px !important;
      line-height: 36px !important;
      white-space: normal !important;
      word-break: keep-all !important;
      margin-bottom: 16px !important;
    }

    /* ===== 手机端优化 ===== */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .app {
        padding: 0;
      }

      h1 {
        font-size: 20px;
        padding: 14px 8px;
      }

      .card {
        padding: 14px;
        border-radius: 12px;
      }

      input,
      select {
        font-size: 17px;
        padding: 12px;
      }

      button {
        font-size: 16px;
        padding: 13px;
      }

      .quote-lines {
        padding: 14px 8px 12px 8px;
      }
    }

    /* 一些小工具类 */
    .mt-0 { margin-top: 0; }
    .mb-0 { margin-bottom: 0; }
    .text-muted { color: #6b7a8a; font-size: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>百货店返点计算器</h1>

    <!-- 汇率设置（仅输入，无滚动） -->
    <section class="card">
      <h2>💱 每日汇率更新</h2>

      <label>韩米汇率（1 人民币 = ? 韩元）</label>
      <input id="exchangeRate" type="number" step="0.1" value="221.3">

      <label>乐天/新罗券价</label>
      <input id="lotteRate" type="number" step="0.1" value="229">

      <label>新世界券价</label>
      <input id="shinsegaeRate" type="number" step="0.1" value="228">

      <label>现代券价</label>
      <input id="hyundaiRate" type="number" step="0.1" value="228.8">
    </section>

    <!-- 报价计算 -->
    <section class="card">
      <h2>🧮 报价计算</h2>

      <label>百货店</label>
      <select id="store">
        <option value="lotte">乐天/新罗</option>
        <option value="shinsegae">新世界</option>
        <option value="hyundai">现代</option>
      </select>

      <label>商品标价（韩元）</label>
      <input id="price" type="number" placeholder="例如 24060000">

      <label>返点比例（%）</label>
      <input id="rebate" type="number" step="0.1" placeholder="例如 8.5">

      <button onclick="calculate()">计算</button>
    </section>

    <!-- 计算结果 -->
    <section class="card result">
      <h2>📊 计算结果</h2>
      <pre id="resultText">请输入数据后点击计算</pre>
      <button onclick="copyResult()">复制报价</button>
    </section>

    <!-- 图片报价预览 -->
    <section class="card">
      <h2>🖼️ 图片报价预览</h2>

      <div id="quoteCard">
        <div class="quote-title">野猪购物返点</div>

        <div class="quote-table">
          <div class="quote-header">百货店标价</div>
          <div class="quote-header">券+返点</div>
          <div class="quote-header">汇率</div>

          <div id="qc-price" class="quote-value">-</div>
          <div id="qc-rebate" class="quote-value">-</div>
          <div id="qc-rate" class="quote-value">-</div>
        </div>

        <div class="quote-lines">
          <div id="qc-line1">① 实际付款 -</div>
          <div id="qc-line2">② 机场退税 -</div>
          <div id="qc-line3">③ 最终到手价 -</div>
        </div>
      </div>

      <button onclick="downloadQuoteImage()">一键生成图片</button>
    </section>
  </div>

  <!-- ===== 引入 html2canvas（用于生成图片） ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- ===== 应用逻辑 ===== -->
  <script>
    (function() {
      // 获取当前选中店铺的券价
      function getStoreRate(storeValue) {
        const lotteRate = parseFloat(document.getElementById('lotteRate').value) || 0;
        const shinsegaeRate = parseFloat(document.getElementById('shinsegaeRate').value) || 0;
        const hyundaiRate = parseFloat(document.getElementById('hyundaiRate').value) || 0;

        switch (storeValue) {
          case 'lotte': return lotteRate;
          case 'shinsegae': return shinsegaeRate;
          case 'hyundai': return hyundaiRate;
          default: return 0;
        }
      }

      // 获取汇率
      function getExchangeRate() {
        return parseFloat(document.getElementById('exchangeRate').value) || 0;
      }

      // 数字格式化（千分位）
      function formatNumber(num) {
        if (num === undefined || num === null || isNaN(num)) return '-';
        const rounded = Math.round(num * 100) / 100;
        const parts = rounded.toString().split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        if (parts[1] === undefined || parts[1] === '00' || parts[1] === '0') {
          return parts[0];
        }
        return parts.join('.');
      }

      // 人民币格式化
      function formatCNY(num) {
        if (num === undefined || num === null || isNaN(num)) return '-';
        return '¥' + num.toFixed(2);
      }

      // 店铺名称
      function getStoreName(storeValue) {
        const map = {
          lotte: '乐天/新罗',
          shinsegae: '新世界',
          hyundai: '现代'
        };
        return map[storeValue] || storeValue;
      }

      // ---------- 计算并更新所有结果 ----------
      window.calculate = function() {
        const price = parseFloat(document.getElementById('price').value);
        const rebate = parseFloat(document.getElementById('rebate').value);
        const store = document.getElementById('store').value;

        if (isNaN(price) || price <= 0 || isNaN(rebate) || rebate <= 0) {
          alert('请输入有效的商品标价和返点比例');
          return;
        }

        const exchangeRate = getExchangeRate();
        if (isNaN(exchangeRate) || exchangeRate <= 0) {
          alert('汇率无效，请检查汇率设置');
          return;
        }

        const storeRate = getStoreRate(store);
        if (isNaN(storeRate) || storeRate <= 0) {
          alert('券价无效，请检查汇率设置');
          return;
        }

        // === 核心计算（全部转为人民币）===
        // 实际付款(人民币) = 标价 / 券价 * 汇率
        const actualPaymentCNY = (price / storeRate) * exchangeRate;

        // 机场退税(人民币) = 实际付款 * 返点比例%
        const taxRefundCNY = actualPaymentCNY * (rebate / 100);

        // 最终到手价(人民币) = 实际付款 - 机场退税
        const finalPriceCNY = actualPaymentCNY - taxRefundCNY;

        // 生成结果文本
        const resultText = `百货店：${getStoreName(store)}\n商品标价：₩${formatNumber(price)}\n返点比例：${rebate}%\n券价：${storeRate}\n汇率：1 CNY = ${exchangeRate} KRW\n\n① 实际付款：${formatCNY(actualPaymentCNY)}\n② 机场退税：${formatCNY(taxRefundCNY)}\n③ 最终到手价：${formatCNY(finalPriceCNY)}`;

        document.getElementById('resultText').textContent = resultText;

        // 更新预览卡片顶部三个值
        document.getElementById('qc-price').textContent = formatNumber(price);
        document.getElementById('qc-rebate').textContent = `${rebate}%`;
        document.getElementById('qc-rate').textContent = exchangeRate;

        // 预览卡片三行（全部显示人民币）
        document.getElementById('qc-line1').textContent = `① 实际付款 ${formatCNY(actualPaymentCNY)}`;
        document.getElementById('qc-line2').textContent = `② 机场退税 ${formatCNY(taxRefundCNY)}`;
        document.getElementById('qc-line3').textContent = `③ 最终到手价 ${formatCNY(finalPriceCNY)}`;

        // 缓存当前计算结果
        window._currentQuote = {
          storeName: getStoreName(store),
          price,
          rebate,
          storeRate,
          exchangeRate,
          actualPaymentCNY,
          taxRefundCNY,
          finalPriceCNY,
          resultText,
          timestamp: new Date().toISOString()
        };
      };

      // ---------- 复制结果 ----------
      window.copyResult = function() {
        const resultText = document.getElementById('resultText').textContent;
        if (!resultText || resultText.includes('请输入数据')) {
          alert('请先进行计算');
          return;
        }
        navigator.clipboard.writeText(resultText).then(() => {
          alert('报价已复制到剪贴板 ✅');
        }).catch(() => {
          const textarea = document.createElement('textarea');
          textarea.value = resultText;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          alert('报价已复制到剪贴板 ✅');
        });
      };

      // ---------- 生成报价图片 ----------
      window.downloadQuoteImage = async function() {
        const quoteCard = document.getElementById('quoteCard');
        if (!quoteCard) return;

        const priceText = document.getElementById('qc-price').textContent;
        if (priceText === '-') {
          alert('请先进行计算，再生成图片');
          return;
        }

        const clone = quoteCard.cloneNode(true);
        clone.classList.add('export-card');
        clone.style.position = 'fixed';
        clone.style.left = '-9999px';
        clone.style.top = '0';
        clone.style.width = '600px';
        clone.style.maxWidth = '600px';
        clone.style.minWidth = '600px';
        clone.style.margin = '0';
        document.body.appendChild(clone);

        try {
          const canvas = await html2canvas(clone, {
            scale: 2,
            backgroundColor: '#f8e6df',
            allowTaint: false,
            useCORS: true,
            logging: false,
            width: 600,
            height: clone.offsetHeight,
            windowWidth: 600,
          });

          const link = document.createElement('a');
          link.download = `野猪报价_${new Date().toISOString().slice(0, 10)}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (err) {
          console.error('生成图片失败:', err);
          alert('生成图片失败，请重试');
        } finally {
          document.body.removeChild(clone);
        }
      };

      // 暴露到全局
      window.formatNumber = formatNumber;
      window.formatCNY = formatCNY;
      window.getStoreName = getStoreName;

    })();
  </script>
</body>
</html>
